[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-runner"
version = "0.1.0"
description = "CLI tool for chatting with local LLMs via Ollama"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "pytest-asyncio>=0.21.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
llm-runner = "llm_runner.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.llm-runner]
# Task Execution Configuration
default_task_timeout = 30  # seconds - timeout for LLM requests and agent tasks
enable_streaming = true    # Real-time token streaming for all LLM requests

# Streaming Configuration
streaming_buffer_size = 1000  # characters - buffer size for stream chunks

# Agent Limiter Configuration
max_concurrent_agents = 3   # Maximum concurrent agents in orchestrator
max_agent_depth = 5         # Maximum nesting depth for sub-agents
